<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="IBM Plex Mono, Menlo, monospace">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
  </defs>

  <rect width="1200" height="920" fill="#0d1117"/>
  <text x="24" y="34" fill="#e6edf3" font-size="18" font-weight="600">aws-ecommerce-platform — architecture overview</text>
  <text x="24" y="54" fill="#7d8590" font-size="12">eu-west-2 (London) — us-east-1 used only for the CloudFront ACM cert</text>

  <!-- Route 53 -->
  <rect x="485" y="76" width="230" height="48" rx="8" fill="#111927" stroke="#2f81f7" stroke-width="1.5"/>
  <text x="500" y="98" fill="#79c0ff" font-size="13" font-weight="600">Route 53 (existing)</text>
  <text x="500" y="114" fill="#8b949e" font-size="10">stefantimpau.com hosted zone</text>

  <line x1="550" y1="124" x2="230" y2="183" stroke="#2f81f7" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="650" y1="124" x2="790" y2="183" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Frontend delivery (blue) -->
  <rect x="60" y="185" width="340" height="207" rx="8" fill="#111927" stroke="#2f81f7" stroke-width="1.5"/>
  <text x="76" y="209" fill="#79c0ff" font-size="13" font-weight="600">Frontend delivery</text>
  <text x="76" y="224" fill="#7d8590" font-size="10">shop.stefantimpau.com</text>

  <rect x="76" y="238" width="308" height="40" rx="6" fill="#0d1520" stroke="#d29922"/>
  <text x="86" y="255" fill="#e3b341" font-size="11" font-weight="600">WAF — CLOUDFRONT scope</text>
  <text x="86" y="269" fill="#8b949e" font-size="9">Common Rule Set · Known Bad Inputs · rate-based</text>

  <rect x="76" y="284" width="308" height="40" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="86" y="301" fill="#e6edf3" font-size="11">CloudFront (OAC)</text>
  <text x="86" y="315" fill="#8b949e" font-size="9">Origin Access Control — no public S3 access</text>

  <rect x="76" y="330" width="308" height="40" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="86" y="347" fill="#e6edf3" font-size="11">S3 (frontend, private)</text>
  <text x="86" y="361" fill="#8b949e" font-size="9">React SPA — custom domain shop.stefantimpau.com</text>

  <!-- API layer (purple) -->
  <rect x="440" y="185" width="700" height="207" rx="8" fill="#111927" stroke="#a371f7" stroke-width="1.5"/>
  <text x="456" y="209" fill="#d2a8ff" font-size="13" font-weight="600">API layer</text>
  <text x="456" y="224" fill="#7d8590" font-size="10">api.shop.stefantimpau.com</text>

  <rect x="456" y="238" width="668" height="40" rx="6" fill="#0d1520" stroke="#d29922"/>
  <text x="466" y="255" fill="#e3b341" font-size="11" font-weight="600">WAF — REGIONAL scope</text>
  <text x="466" y="269" fill="#8b949e" font-size="9">SQLi rule set · attached to the internal ALB, not the API Gateway stage</text>

  <rect x="456" y="284" width="320" height="54" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="466" y="301" fill="#e6edf3" font-size="11">API Gateway (HTTP API)</text>
  <text x="466" y="315" fill="#8b949e" font-size="9">Cognito JWT authorizer on every route</text>
  <text x="466" y="327" fill="#8b949e" font-size="9">except the public product listing</text>

  <rect x="804" y="284" width="320" height="54" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="814" y="301" fill="#e6edf3" font-size="11">VPC Link</text>
  <text x="814" y="315" fill="#8b949e" font-size="9">connects API Gateway to the internal ALB</text>

  <line x1="776" y1="311" x2="804" y2="311" stroke="#79c0ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="456" y="344" width="668" height="40" rx="6" fill="#0d1520" stroke="#3fb950"/>
  <text x="466" y="361" fill="#7ee787" font-size="11" font-weight="600">Internal ALB — WAF-protected</text>
  <text x="466" y="375" fill="#8b949e" font-size="9">/products* · /cart* · /users* · /orders* (path-based routing)</text>

  <line x1="790" y1="392" x2="790" y2="412" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Backend services group -->
  <rect x="440" y="412" width="700" height="175" rx="8" fill="#111927" stroke="#30363d"/>
  <text x="456" y="436" fill="#e6edf3" font-size="12" font-weight="600">Backend services — ECS Fargate (independent IAM task roles)</text>

  <rect x="456" y="450" width="150" height="56" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="466" y="469" fill="#e6edf3" font-size="11" font-weight="600">Product</text>
  <text x="466" y="483" fill="#8b949e" font-size="9">ECS Fargate</text>
  <text x="466" y="496" fill="#8b949e" font-size="9">→ DynamoDB (products)</text>

  <rect x="628" y="450" width="150" height="56" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="638" y="469" fill="#e6edf3" font-size="11" font-weight="600">Cart</text>
  <text x="638" y="483" fill="#8b949e" font-size="9">ECS Fargate</text>
  <text x="638" y="496" fill="#8b949e" font-size="9">→ DynamoDB (cart)</text>

  <rect x="800" y="450" width="150" height="56" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="810" y="469" fill="#e6edf3" font-size="11" font-weight="600">User</text>
  <text x="810" y="483" fill="#8b949e" font-size="9">ECS Fargate</text>
  <text x="810" y="496" fill="#8b949e" font-size="9">→ Cognito (user pool)</text>

  <rect x="972" y="450" width="150" height="56" rx="6" fill="#0d1520" stroke="#30363d"/>
  <text x="982" y="469" fill="#e6edf3" font-size="11" font-weight="600">Order</text>
  <text x="982" y="483" fill="#8b949e" font-size="9">ECS Fargate</text>
  <text x="982" y="496" fill="#8b949e" font-size="9">→ RDS Postgres (orders)</text>

  <line x1="1047" y1="506" x2="1047" y2="607" stroke="#79c0ff" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- SNS fanout -->
  <rect x="907" y="607" width="280" height="110" rx="8" fill="#111927" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="923" y="629" fill="#79c0ff" font-size="12" font-weight="600">SNS (order-events)</text>
  <text x="923" y="647" fill="#8b949e" font-size="10">├─ email subscription — order confirmation</text>
  <text x="923" y="663" fill="#8b949e" font-size="10">└─ SQS (shipping) — with a <tspan fill="#ffa198">dead-letter queue</tspan></text>
  <text x="923" y="683" fill="#7d8590" font-size="9">Ops alerts (RDS storage, ECS tasks) use a separate</text>
  <text x="923" y="695" fill="#7d8590" font-size="9">SNS topic — never the same channel as a customer email.</text>

  <!-- Security / cost / CI/CD strip -->
  <rect x="60" y="737" width="1080" height="130" rx="8" fill="#111927" stroke="#30363d"/>
  <text x="76" y="761" fill="#e6edf3" font-size="13" font-weight="600">Security, cost &amp; CI/CD</text>
  <text x="76" y="781" fill="#8b949e" font-size="11">Two managed-rule WAF Web ACLs (CloudFront + Regional) — Common Rule Set, Known Bad Inputs, rate-based blocking, SQLi on the ALB path.</text>
  <text x="76" y="799" fill="#8b949e" font-size="11">Four ECS task roles, one per service — Product can't touch the orders table, Order can't touch Cognito; least-privilege scoped per domain.</text>
  <text x="76" y="817" fill="#8b949e" font-size="11">CI/CD: GitHub Actions deploys via OIDC — no long-lived AWS keys in the repo, deploy role scoped to redeploy actions only (see the blog post).</text>
  <text x="76" y="835" fill="#8b949e" font-size="11">AWS Budget with 50/80/100% spend alerts, plus a scripted, confirmation-gated terraform destroy for teardown between demo sessions.</text>
  <text x="76" y="855" fill="#7d8590" font-size="10">13 real incidents diagnosed and fixed, documented in the README rather than hidden.</text>

  <text x="24" y="897" fill="#484f58" font-size="10">github.com/stefantimpau/aws-ecommerce-platform</text>
</svg>
